<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="fav-top-grad" x1="15%" y1="10%" x2="85%" y2="50%">
      <stop offset="0%" stop-color="#1769F8"/>
      <stop offset="100%" stop-color="#00D4E8"/>
    </linearGradient>
    <linearGradient id="fav-bot-grad" x1="15%" y1="90%" x2="85%" y2="50%">
      <stop offset="0%" stop-color="#071B3A"/>
      <stop offset="100%" stop-color="#6D28D9"/>
    </linearGradient>
    <linearGradient id="fav-wave-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D4E8"/>
      <stop offset="50%" stop-color="#1769F8"/>
      <stop offset="100%" stop-color="#6D28D9"/>
    </linearGradient>
  </defs>
  
  <!-- Outer Hexagonal "E" Frame -->
  <!-- Top & Left Upper Arm -->
  <path d="M 50 12 L 80 28 L 68 35 L 48 24 L 26 36 L 26 50 L 14 50 L 14 30 Z" fill="url(#fav-top-grad)" />
  <!-- Bottom & Left Lower Arm -->
  <path d="M 14 50 L 26 50 L 26 64 L 48 76 L 68 65 L 80 72 L 50 88 L 14 70 Z" fill="url(#fav-bot-grad)" />

  <!-- Middle Bar of "E" -->
  <polygon points="28,47 52,47 48,53 24,53" fill="url(#fav-top-grad)" />

  <!-- Waveform Bars -->
  <!-- Bar 1 -->
  <rect x="56" y="44" width="4" height="12" rx="2" fill="#00D4E8" />
  <!-- Bar 2 -->
  <rect x="63" y="38" width="4" height="24" rx="2" fill="url(#fav-wave-grad)" />
  <!-- Bar 3 (Center Tall) -->
  <rect x="70" y="32" width="4" height="36" rx="2" fill="#1769F8" />
  <!-- Bar 4 -->
  <rect x="77" y="38" width="4" height="24" rx="2" fill="#6D28D9" />
  <!-- Bar 5 -->
  <rect x="84" y="44" width="4" height="12" rx="2" fill="#8B5CF6" />
</svg>

